# Automatic dependency updates (Dependabot).
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm dependencies (package.json and package-lock.json at the root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The types follow the oldest Node version Habblaud supports (engines: >=22.12). With a newer version's types,
      # the typecheck would let through APIs that don't exist there. Bumped by hand, together with engines and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Base images of the Dockerfile (node:24-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The image stays on a Node LTS version. Moving to a new major (e.g. 24 -> 26 once 26 is LTS) is done by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Actions used in .github/workflows/ci.yml (actions/checkout, actions/setup-node)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
