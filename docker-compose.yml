# Habblaud on local Docker.
#
# Start it with `npm run docker:up`: the script detects the Claude Code accounts on the host and writes
# docker-compose.override.yml (not under version control) with:
#   - READ-ONLY mounts of <account>/projects and <account>/sessions at /claude/<account>/...
#     (never the whole account folder: credentials and settings live there) and of ~/.habblaud/usage
#     (5-hour/weekly usage captured by the mod or the statusline tap) at /usage;
#   - for Codex, ONLY <folder>/sessions, <folder>/archived_sessions and <folder>/thread-writer-locks at
#     /codex/<account>/... (never auth.json, config.toml, history.jsonl, logs or the SQLite databases);
#   - HABBLAUD_CLAUDE_DIRS, HABBLAUD_CODEX_DIRS, HABBLAUD_ACCOUNTS and HABBLAUD_USAGE_DIR.
# Compose merges the override automatically into any `docker compose ...` run in this folder.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    container_name: habblaud
    restart: unless-stopped
    # Transcripts are sensitive: by default the port is published ONLY on the host's local interface
    # (HABBLAUD_BIND=0.0.0.0 in .env opens it to the local network; see the README).
    ports:
      - "${HABBLAUD_BIND:-127.0.0.1}:${HABBLAUD_PORT:-4747}:4747"
      # The port for phone access (with login) is only published after npm run remote:setup: the
      # docker-compose.override.yml that docker:up writes adds it.
    volumes:
      - habblaud-data:/data
    # Options that may come from .env (or the environment) into the container.
    environment:
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      # The same value as the published port above: the terminal (and anything acting on sessions) only turns on with a local bind.
      HABBLAUD_BIND: ${HABBLAUD_BIND:-127.0.0.1}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-}
      # 0 turns off messages from the office (sending messages to agents from the page and the terminal).
      HABBLAUD_MENSAGENS: ${HABBLAUD_MENSAGENS:-}
      # 0 turns off the new-version check (a look at the GitHub releases every 6 h).
      HABBLAUD_UPDATE_CHECK: ${HABBLAUD_UPDATE_CHECK:-}
      HABBLAUD_LANG: ${HABBLAUD_LANG:-}
      # White-labeling: the name shown in the page title, the pixel logo, the home-screen app and the login page
      # (1-24 characters; anything else falls back to Habblaud). HABBLAUD_BRAND_SHORT: the home-screen label.
      HABBLAUD_BRAND_NAME: ${HABBLAUD_BRAND_NAME:-Habblaud}
      HABBLAUD_BRAND_SHORT: ${HABBLAUD_BRAND_SHORT:-}
      # 0 leaves Codex sessions out of the office.
      HABBLAUD_CODEX: ${HABBLAUD_CODEX:-}
      # 1 turns on New agent from the office (in Docker, the host helper, npm run codex:bridge, starts the
      # session; the interactive terminal itself doesn't run in the container).
      HABBLAUD_PTY: ${HABBLAUD_PTY:-}
      # Remote access with login (server/http/remote.ts).
      HABBLAUD_REMOTE_USER: ${HABBLAUD_REMOTE_USER:-}
      HABBLAUD_REMOTE_PASSWORD_HASH: ${HABBLAUD_REMOTE_PASSWORD_HASH:-}
      HABBLAUD_REMOTE_ALLOW: ${HABBLAUD_REMOTE_ALLOW:-}
      HABBLAUD_REMOTE_KIOSK_TOKEN_HASH: ${HABBLAUD_REMOTE_KIOSK_TOKEN_HASH:-}
      HABBLAUD_REMOTE_INSECURE_HTTP: ${HABBLAUD_REMOTE_INSECURE_HTTP:-}
      # 1 lets other machines send their Claude Code sessions here (server/ingest/; remote port with HTTPS only).
      HABBLAUD_INGEST: ${HABBLAUD_INGEST:-}
    # Hardening: read-only file system (except /data and /tmp), no extra capabilities.
    read_only: true
    # /tmp in memory, with a cap: without `size` Docker allows half of the host's RAM.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Minimal init process: forwards signals and reaps orphaned processes.
    init: true

volumes:
  habblaud-data:
